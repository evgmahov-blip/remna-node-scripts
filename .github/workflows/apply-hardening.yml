name: Apply hardening patch

on:
  push:
    branches: [hardening-v2]
    paths:
      - tools/apply_hardening.py
      - .github/workflows/apply-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening-v2
          fetch-depth: 0
      - name: Apply hardening
        run: python3 tools/apply_hardening.py
      - name: Syntax check
        run: |
          bash -n install-caddy-node-reality-stream.sh
          bash -n install-caddy-node-reality-stream-core.sh
          bash -n protection-manager.sh
          bash -n telemt-manager.sh
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S error install-caddy-node-reality-stream.sh install-caddy-node-reality-stream-core.sh protection-manager.sh telemt-manager.sh
      - name: Commit generated hardening changes
        run: |
          if git diff --quiet; then
            echo 'No changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install-caddy-node-reality-stream.sh protection-manager.sh
          git commit -m 'fix: harden diagnostics handoff secrets and firewall config'
          git push origin HEAD:hardening-v2
