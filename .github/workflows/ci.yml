name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: bash -n all shell scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' f; do
            echo "checking $f"
            bash -n "$f"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)

      - name: shellcheck errors
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -d '' files < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          shellcheck -S error "${files[@]}"

      - name: supply-chain guard
        shell: bash
        run: |
          set -Eeuo pipefail

          # Root-executed code must not depend on these previously mutable or
          # privacy-sensitive endpoints.
          mapfile -d '' shell_files < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)

          ! grep -nE 'ghostos\.space|GHOST_(LIC|ID|SITE|DL|Q)|stream\.deepbeat\.ru|rustream\.remna\.space|\.2rdp\.ru|setup-remna-node|radio-stub-site/main|CyberOK_Skipa_ips/main|AS_Network_List/main|ipdeny\.com|telemt|3x-ui|3xui' "${shell_files[@]}"

          ! grep -nE 'protocols[[:space:]]+tls1\.2[[:space:]]+tls1\.2|printf .*Password:|printf .*Username:' "${shell_files[@]}"

          # Existing image / installer invariants.
          ! grep -nE 'image:[[:space:]]*remnawave/node:latest|https://get\.docker\.com' install-caddy-node-reality-stream-core.sh

          # Firewall data sources must be immutable snapshots.
          grep -Fq 'TSPU_COMMIT=a465e13f4cb43c1692eb650430eb857900558c5d' protection-manager.sh
          grep -Fq 'GOV_COMMIT=0e999cd730c4d6ca3d58053407a22f63f2d464e6' protection-manager.sh
          grep -Fq 'GEOIP_COMMIT=6e3f7978b0391935e306060b11beba774fc7f624' protection-manager.sh

      - name: invisible-character guard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          forbidden = {
              "\u200b": "ZERO WIDTH SPACE",
              "\u200c": "ZERO WIDTH NON-JOINER",
              "\u200d": "ZERO WIDTH JOINER",
              "\u2060": "WORD JOINER",
              "\ufeff": "ZERO WIDTH NO-BREAK SPACE/BOM",
          }

          bad = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for char, name in forbidden.items():
                  if char in text:
                      bad.append(f"{path}: {name}")

          if bad:
              raise SystemExit("Invisible control characters found:\n" + "\n".join(bad))
          PY

      - name: strict-mode guards
        run: |
          set -e
          for f in             install.sh             clean-install.sh             full-clean-reinstall.sh             install-caddy-node-reality-stream-core.sh             protection-manager.sh
          do
            grep -Fq 'set -Eeuo pipefail' "$f"
          done

      - name: Core must not overwrite manager
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'MANAGER_PATH=$SCRIPT_INSTALL_DIR/install-caddy-node-reality-stream.sh' install-caddy-node-reality-stream-core.sh
          grep -Fq 'CORE_SELF_PATH=$SCRIPT_INSTALL_DIR/install-caddy-node-reality-stream-core.sh' install-caddy-node-reality-stream-core.sh
          ! grep -Fq 'install -o root -g root -m 0700 "$current" "$MANAGER_PATH"' install-caddy-node-reality-stream-core.sh

      - name: Verify pinned installer chain
        shell: bash
        run: |
          set -Eeuo pipefail

          verify_blob() {
            local ref="$1" path="$2" expected="$3" actual
            actual="$(git rev-parse "$ref:$path")"
            [ "$actual" = "$expected" ] || {
              echo "pin mismatch: $ref:$path -> $actual, expected $expected" >&2
              exit 1
            }
          }

          for launcher in install.sh clean-install.sh; do
            ref="$(sed -n 's/^PINNED_REF="\([^"]*\)"/\1/p' "$launcher")"
            expected="$(sed -n 's/^EXPECTED_BLOB_SHA="\([^"]*\)"/\1/p' "$launcher")"
            verify_blob "$ref" full-clean-reinstall.sh "$expected"
          done

          ref="$(sed -n 's/^PINNED_REF="\([^"]*\)"/\1/p' full-clean-reinstall.sh)"
          expected="$(sed -n 's/^EXPECTED_BLOB_SHA="\([^"]*\)"/\1/p' full-clean-reinstall.sh)"
          verify_blob "$ref" install-caddy-node-reality-stream.sh "$expected"

          ref="$(sed -n 's/^REPO_REF=//p' install-caddy-node-reality-stream.sh)"
          verify_blob "$ref" install-caddy-node-reality-stream-core.sh "$(sed -n 's/^CORE_BLOB_SHA=//p' install-caddy-node-reality-stream.sh)"
          verify_blob "$ref" protection-manager.sh "$(sed -n 's/^PROTECTION_BLOB_SHA=//p' install-caddy-node-reality-stream.sh)"
          verify_blob "$ref" caddy-resilient-start.sh "$(sed -n 's/^CADDY_GUARD_BLOB_SHA=//p' install-caddy-node-reality-stream.sh)"

      - name: Interactive safety guards
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq "MENU_BACK_RC=20" install-caddy-node-reality-stream.sh
          grep -Fq "MENU_BACK_RC=20" install-caddy-node-reality-stream-core.sh
          grep -Fq "MENU_BACK_RC=20" protection-manager.sh
          grep -Fq "menu_action run_core repair" install-caddy-node-reality-stream.sh
          grep -Fq "menu_action protection menu" install-caddy-node-reality-stream.sh
          grep -Fq "[13] Профиль для копипасты (XHTTP + REALITY :443)" install-caddy-node-reality-stream.sh
          grep -Fq "13) menu_action run_core config-profile" install-caddy-node-reality-stream.sh
          grep -Fq "[19] РКН защита (TSPU/GOV)" install-caddy-node-reality-stream.sh
          grep -Fq "19) menu_action protection rkn" install-caddy-node-reality-stream.sh
          grep -Fq "rkn_menu(){" protection-manager.sh
          grep -Fq 'cat "$PROFILE_INBOUNDS"' install-caddy-node-reality-stream-core.sh
          grep -Fq "curl -ksS --noproxy '*'" install-caddy-node-reality-stream-core.sh
          grep -Fq "site_probe_diagnostics" install-caddy-node-reality-stream-core.sh

      - name: Single-port XHTTP Reality profile guards
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -d '' shell_files < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          ! grep -nF '7443' "${shell_files[@]}"
          ! grep -nF 'BACKEND_PORT' "${shell_files[@]}"
          ! grep -nF 'XHTTP_INBOUND' "${shell_files[@]}"
          ! grep -nF 'REALITY_INBOUND' "${shell_files[@]}"
          ! grep -nF '"mode": "packet-up"' install-caddy-node-reality-stream-core.sh

          grep -Fq 'REALITY_SOCKET_TARGET=/dev/shm/nginx.sock' install-caddy-node-reality-stream-core.sh
          grep -Fq '"port": 443' install-caddy-node-reality-stream-core.sh
          grep -Fq '"listen": "0.0.0.0"' install-caddy-node-reality-stream-core.sh
          grep -Fq '"network": "xhttp"' install-caddy-node-reality-stream-core.sh
          grep -Fq '"security": "reality"' install-caddy-node-reality-stream-core.sh
          grep -Fq '"mode": "auto"' install-caddy-node-reality-stream-core.sh
          grep -Fq '"cMaxReuseTimes": 12' install-caddy-node-reality-stream-core.sh
          grep -Fq '"seqKey": "visitor_id"' install-caddy-node-reality-stream-core.sh
          grep -Fq '"sessionIDKey": "auth_session"' install-caddy-node-reality-stream-core.sh
          grep -Fq '"xPaddingBytes": "270-1096"' install-caddy-node-reality-stream-core.sh
          grep -Fq '"xPaddingHeader": "X-Request-Token"' install-caddy-node-reality-stream-core.sh
          grep -Fq '"xPaddingPlacement": "queryInHeader"' install-caddy-node-reality-stream-core.sh
          grep -Fq '"xver": 1' install-caddy-node-reality-stream-core.sh
          grep -Fq '"target": "$REALITY_SOCKET_TARGET"' install-caddy-node-reality-stream-core.sh
          grep -Fq 'accept-proxy mode 660' install-caddy-node-reality-stream-core.sh
          grep -Fq '${REALITY_SOCKET_DIR}:/dev/shm' install-caddy-node-reality-stream-core.sh
          grep -Fq 'remna-reality-fallback.service' install-caddy-node-reality-stream-core.sh

      - name: Caddy pre-start privilege guard
        run: grep -Fq 'ExecStartPre=+$SELF prepare' caddy-resilient-start.sh

      - name: apt lock wait guard
        run: |
          grep -Fq 'DPkg::Lock::Timeout=' full-clean-reinstall.sh
          grep -Fq 'DPkg::Lock::Timeout=' install-caddy-node-reality-stream-core.sh
          grep -Fq 'DPkg::Lock::Timeout=' protection-manager.sh
