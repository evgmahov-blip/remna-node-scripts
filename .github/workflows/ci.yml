name: CI

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' f; do
            echo "checking $f"
            bash -n "$f"
          done < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)

      - name: Shellcheck errors
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -d '' files < <(find . -type f -name '*.sh' -not -path './.git/*' -print0)
          shellcheck -S error "${files[@]}"

      - name: Verify recovered NEXT source
        shell: bash
        run: |
          set -Eeuo pipefail

          test "$(git rev-parse HEAD:vendor/remna-next-source.tar.gz)" = "51a91d5745d0bea9b03eefeeaac52677fcf56b60"
          test "$(git rev-parse 721269e2c48e31b7cac86e04bc14c46b33e31e72:vendor/remna-next-source.tar.gz)" = "51a91d5745d0bea9b03eefeeaac52677fcf56b60"

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          tar -tzf vendor/remna-next-source.tar.gz | sed '/\/$/d' | LC_ALL=C sort > "$tmp/listing.txt"
          printf '%s\n' \
            'docker-compose.yml' \
            'next-installer/next-runtime-guards.sh' \
            'next-installer/remnawave-transport-manager.sh' \
            'next-installer/rkn-watcher-manager.sh' \
            'next-installer/selfsteal-site-manager.sh' \
            'next-installer/setup_node-legacy.sh' \
            'next-installer/xhttp-signature-manager.sh' \
            'nginx.conf' \
            > "$tmp/expected.txt"
          diff -u "$tmp/expected.txt" "$tmp/listing.txt"

          ! tar -tzf vendor/remna-next-source.tar.gz | grep -E '(^|/)(\.env|certs?/|.*private.*key|reality\.env)$'

          tar -xzf vendor/remna-next-source.tar.gz -C "$tmp"
          (
            cd "$tmp"
            printf '%s\n' \
              '728ed22841a1c494a9d9fce026109f6151fe16a2b861496d267005bd4850477c  next-installer/setup_node-legacy.sh' \
              '620797d0677d091d6550894e32fea58ce7f2adf2f125d6f6ccfb217a7b3382fd  next-installer/next-runtime-guards.sh' \
              '441c82fb0eb3b155986d7b84bd66aa82bb1d028b8a9c49e02f1fbac326fac2e2  next-installer/remnawave-transport-manager.sh' \
              '2d5838809881a00cac755b43606d7c929e7ba8f5786f64ebff849eb73edeb3e7  next-installer/rkn-watcher-manager.sh' \
              'b783e94f2ef3764b2e397cba9eb96aeab88d7da11da017a2c867054f9546a84a  next-installer/selfsteal-site-manager.sh' \
              'dbbd1110aec2e6dd32aee204b6d0174d7fe511e1b97118570cbbea553946bd4a  next-installer/xhttp-signature-manager.sh' \
              > SHA256SUMS
            sha256sum -c SHA256SUMS
            for f in next-installer/*.sh; do bash -n "$f"; done
          )

      - name: Verify Hysteria2 overlay
        shell: bash
        run: |
          set -Eeuo pipefail

          t=next-installer/remnawave-transport-manager.sh
          test "$(git rev-parse HEAD:$t)" = "62ff1364c26d88f357968422d5591b3d2b8d9e78"
          test "$(git rev-parse 6f02c87c10d1d47fb4abcb234755823d1a1067bf:$t)" = "62ff1364c26d88f357968422d5591b3d2b8d9e78"

          grep -Fq '"clients": []' "$t"
          grep -Fq '"routeOnly": true' "$t"
          grep -Fq '"destOverride": ["http", "tls", "quic"]' "$t"
          grep -Fq '"minVersion": "1.2"' "$t"
          grep -Fq '"maxVersion": "1.3"' "$t"
          grep -Fq '"rejectUnknownSni": true' "$t"
          grep -Fq '"enableSessionResumption": true' "$t"
          grep -Fq 'verify_hysteria_profile_shape(){' "$t"
          grep -Fq 'hysteriaSettings.auth=<UUID пользователя>' "$t"
          grep -Fq 'Final Mask: ПУСТО / DEFAULT' "$t"
          grep -Fq 'Vless Route ID: ПУСТО / DEFAULT' "$t"
          grep -Fq 'Mapper: ПУСТО.' "$t"
          ! grep -Fq 'HYSTERIA_CONGESTION=' "$t"
          grep -Fq 'settings.vnext ДОЛЖЕН содержать РОВНО 1 endpoint' "$t"
          grep -Fq 'vnext should have one and only one member' "$t"

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          tar -xzf vendor/remna-next-source.tar.gz -C "$tmp"
          raw="$tmp/next-installer/remnawave-transport-manager.sh"
          grep -Fq '"settings": {"version": 2, "users": []}' "$raw"
          ! grep -Fq 'verify_hysteria_profile_shape(){' "$raw"

      - name: Verify Server Multitest
        shell: bash
        run: |
          set -Eeuo pipefail

          t=next-installer/server-multitest.sh
          test "$(git rev-parse HEAD:$t)" = "2cc4cba0df9176fa169b4d4caec7f2511fdc4559"
          test "$(git rev-parse bb2597c8da6c7476a9d42f3c403b67511ca5a2b1:$t)" = "2cc4cba0df9176fa169b4d4caec7f2511fdc4559"

          grep -Fq 'Balbuto/safe-remnanode-setup' "$t"
          grep -Fq '274d84d9daa3b4d4a33264ba77992210aedd9b32' "$t"
          grep -Fq 'Censorcheck — DPI' "$t"
          grep -Fq 'iPerf3 — bench.tlab.pw' "$t"
          grep -Fq 'YABS' "$t"
          grep -Fq 'Geo/Media Unlock — RegionRestrictionCheck' "$t"
          grep -Fq 'IPQuality — ASN / risk / blacklist / media / mail' "$t"
          grep -Fq 'CENSOR_BLOB_SHA=' "$t"
          grep -Fq 'IPERF_RU_BLOB_SHA=' "$t"
          grep -Fq 'YABS_BLOB_SHA=' "$t"
          grep -Fq 'REGION_BLOB_SHA=' "$t"
          grep -Fq 'IPQUALITY_BLOB_SHA=' "$t"
          grep -Fq 'prepare_censorcheck(){' "$t"
          grep -Fq 'prepare_iperf_ru(){' "$t"
          grep -Fq "IFS=' ' read -r bytes speed seconds" "$t"
          grep -Fq 'Итог:' "$t"
          ! grep -Fq '"$YABS_URL" "$YABS_BLOB_SHA" -4' "$t"
          grep -Fq 'Network Bench (HTTPS 100MB)' "$t"
          grep -Fq 'https://speed.cloudflare.com/__down?bytes=100000000' "$t"
          grep -Fq 'NEXTTRACE_VERSION="v1.7.3"' "$t"
          grep -Fq 'NEXTTRACE_AMD64_SHA256="aa75440fcdee46c16d941f48f9dabee1eb4c35bea6b739b0960fcf8307088c29"' "$t"
          grep -Fq 'NEXTTRACE_ARM64_SHA256="4fbf436e2d4737e4a491e71ce3cd140a7a268d43ec94fb9ac9497aec7eda080e"' "$t"
          grep -Fq 'NextTrace Route/MTR' "$t"
          grep -Fq 'NextTrace Path MTU' "$t"
          grep -Fq 'NextTrace Globalping' "$t"
          grep -Fq 'Автоматический режим: все тесты идут подряд без подтверждений.' "$t"
          ! sed -n '/run_all(){/,/^}/p' "$t" | grep -Fq 'read -r action'
          ! sed -n '/99)/,/;;/p' "$t" | grep -Fq 'pause'
          grep -Fq '"$target" --from "$from" --tcp --port 443' "$t"
          bash "$t" list | grep -Fq '17) NextTrace Globalping'
          ! grep -Eq '(^|[^[:alnum:]])http://' "$t"

          grep -Fq 'TESTER_REF="bb2597c8da6c7476a9d42f3c403b67511ca5a2b1"' full-clean-reinstall.sh
          grep -Fq 'TESTER_BLOB_SHA="2cc4cba0df9176fa169b4d4caec7f2511fdc4559"' full-clean-reinstall.sh
          grep -Fq 'server-multitest.sh' full-clean-reinstall.sh
          grep -Fq 'sudo remnanode-next multitest' full-clean-reinstall.sh
          grep -Fq 'multitest|server-test|tests)' full-clean-reinstall.sh

      - name: Working-node topology provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          tar -xzf vendor/remna-next-source.tar.gz -C "$tmp"

          compose="$tmp/docker-compose.yml"
          nginx="$tmp/nginx.conf"

          grep -Fq 'image: ghcr.io/remnawave/node:latest' "$compose"
          grep -Fq 'image: nginx:1.28' "$compose"
          grep -Fq 'container_name: remnanode' "$compose"
          grep -Fq 'container_name: remnawave-nginx' "$compose"
          test "$(grep -Fc -- '- /dev/shm:/dev/shm:rw' "$compose")" -ge 2
          grep -Fq 'listen unix:/dev/shm/nginx.sock ssl proxy_protocol' "$nginx"

          grep -Fq 'install -m 0700 "$tmp/next-installer/"*.sh "$NEXT_DIR/"' full-clean-reinstall.sh
          ! grep -Fq '"$tmp/docker-compose.yml"' full-clean-reinstall.sh
          ! grep -Fq '"$tmp/nginx.conf"' full-clean-reinstall.sh

      - name: NEXT transport architecture
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          tar -xzf vendor/remna-next-source.tar.gz -C "$tmp"

          t=next-installer/remnawave-transport-manager.sh
          base="$tmp/next-installer/setup_node-legacy.sh"
          rkn="$tmp/next-installer/rkn-watcher-manager.sh"
          guards="$tmp/next-installer/next-runtime-guards.sh"

          grep -Fq '1) VLESS + REALITY + XHTTP (основной)' "$t"
          grep -Fq '2) VLESS + REALITY + RAW (fallback)' "$t"
          grep -Fq '3) Hysteria2 + TLS (UDP)' "$t"
          grep -Fq '4) XHTTP + Hysteria2 одновременно (TCP/443 + UDP/443)' "$t"
          grep -Fq 'PUBLIC_PORT="${PUBLIC_PORT:-443}"' "$t"
          grep -Fq 'SELFSTEAL_SOCKET="${SELFSTEAL_SOCKET:-/dev/shm/nginx.sock}"' "$t"
          grep -Fq '"protocol": "vless"' "$t"
          grep -Fq '"network": "xhttp"' "$t"
          grep -Fq '"network": "raw"' "$t"
          grep -Fq '"protocol": "hysteria"' "$t"
          grep -Fq '"network": "hysteria"' "$t"
          grep -Fq '"security": "tls"' "$t"
          grep -Fq '"alpn": ["h3"]' "$t"
          grep -Fq '"routeOnly": true' "$t"
          grep -Fq '"minVersion": "1.2"' "$t"
          grep -Fq '"maxVersion": "1.3"' "$t"
          grep -Fq 'xhttp-hysteria2.json' "$t"

          grep -Fq 'remnawave-nginx:' "$base"
          grep -Fq '/dev/shm/nginx.sock' "$base"
          grep -Fq 'rollback 120 сек' "$rkn"
          grep -Fq 'last-good-tspu.ipset' "$rkn"
          grep -Fq 'restore-hysteria' "$guards"
          grep -Fq 'sync-rkn-watch' "$guards"

      - name: Existing-node NEXT V2 migration guard
        shell: bash
        run: |
          set -Eeuo pipefail

          v2=next-installer/existing-node-v2-cleanup.sh
          test "$(git rev-parse HEAD:$v2)" = "755e94a26fa7cc835e65ce415c9d87f07a7fa86e"
          test "$(git rev-parse 551a80ca1802d3087c53edf12652f104cd1c721d:$v2)" = "755e94a26fa7cc835e65ce415c9d87f07a7fa86e"

          grep -Fq 'TASK_NAME="REMNA NODE EXISTING-NODE V2 CLEANUP"' "$v2"
          grep -Fq 'V2 preflight PASS' "$v2"
          grep -Fq 'remna-node-v2-backups' "$v2"
          grep -Fq 'remna-reality-handoff.timer' "$v2"
          grep -Fq 'REMNA_GUARD' "$v2"
          grep -Fq 'REMNA_RKN_SCANNERS' "$v2"
          grep -Fq 'TSPUIPS' "$v2"
          grep -Fq '/etc/hysteria2' "$v2"
          grep -Fq 'docker rm -f remnanode remnawave-nginx' "$v2"
          grep -Fq 'V2 POSTCHECK PASS' "$v2"
          grep -Fq 'global UFW reset НЕ выполнялся' "$v2"
          ! grep -Fq 'ufw --force reset' "$v2"

          grep -Fq 'V2_CLEANUP_REF="551a80ca1802d3087c53edf12652f104cd1c721d"' full-clean-reinstall.sh
          grep -Fq 'V2_CLEANUP_BLOB_SHA="755e94a26fa7cc835e65ce415c9d87f07a7fa86e"' full-clean-reinstall.sh
          grep -Fq 'NETWORK_REF="dd7474f8f72b7d4b56221e89bb969ac75b2dff00"' full-clean-reinstall.sh
          grep -Fq 'NETWORK_BLOB_SHA="8616189227534a4c651000d233162b1603a50d7b"' full-clean-reinstall.sh
          grep -Fq 'TESTER_REF="bb2597c8da6c7476a9d42f3c403b67511ca5a2b1"' full-clean-reinstall.sh
          grep -Fq 'TESTER_BLOB_SHA="2cc4cba0df9176fa169b4d4caec7f2511fdc4559"' full-clean-reinstall.sh
          grep -Fq 'run_existing_node_v2(){' full-clean-reinstall.sh
          grep -Fq 'NEXT V2 — существующая/legacy нода' full-clean-reinstall.sh
          grep -Fq 'migrate-existing|install-v2|legacy-to-next' full-clean-reinstall.sh
          grep -Fq 'exec bash "$TMP" migrate-existing' clean-install.sh
          grep -Fq 'exec bash "$TMP" install' install.sh
          ! grep -Fq 'Для продолжения введи MIGRATE' full-clean-reinstall.sh
          ! grep -Fq 'read -r answer < "$TTY"' <(sed -n '/run_existing_node_v2(){/,/^}/p' full-clean-reinstall.sh)

      - name: Friendly menu, profiles and network guard
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'ПОКАЗАТЬ ГОТОВЫЙ ПРОФИЛЬ / ПРОФИЛИ ДЛЯ КОПИПАСТЫ? [Y/n]:' full-clean-reinstall.sh
          grep -Fq 'sudo remnanode-next current-profile' full-clean-reinstall.sh
          grep -Fq 'Config Profile + НАСТРОЙКИ HOST REMNAWAVE' full-clean-reinstall.sh
          grep -Fq '[3] Hysteria2 + TLS' full-clean-reinstall.sh
          grep -Fq '→ JSON Config Profile + HOST HYSTERIA2' full-clean-reinstall.sh
          grep -Fq '[4] XHTTP + Hysteria2' full-clean-reinstall.sh
          grep -Fq '→ JSON Config Profile + HOST XHTTP + HOST HYSTERIA2' full-clean-reinstall.sh
          grep -Fq '[5] ТОЛЬКО HOST XHTTP' full-clean-reinstall.sh
          grep -Fq '[6] ТОЛЬКО HOST HYSTERIA2' full-clean-reinstall.sh
          grep -Fq 'host-hysteria2|host-hysteria)' full-clean-reinstall.sh
          grep -Fq '[13] СЕТЬ / BBR TUNE (DEFAULT) / BBR3 (OPTIONAL)' full-clean-reinstall.sh
          grep -Fq '[14] HYSTERIA2 DIAG — UDP/443 + DNS + RKN counters' full-clean-reinstall.sh
          grep -Fq '[15] МУЛЬТИ-ТЕСТЫ СЕРВЕРА — Balbuto Module D' full-clean-reinstall.sh
          grep -Fq 'sudo remnanode-next multitest 1..17' full-clean-reinstall.sh
          grep -Fq 'hysteria-diag|hy2-diag)' full-clean-reinstall.sh
          grep -Fq 'RKN UDP/443 DROP rule + counters:' full-clean-reinstall.sh
          grep -Fq 'cli --dump-config-raw' full-clean-reinstall.sh
          grep -Fq 'HYSTERIA2 RUNTIME DRIFT' full-clean-reinstall.sh
          grep -Fq 'runtime семантически совпадает с локальным hysteria2-tls.json' full-clean-reinstall.sh
          ! sed -n '/hysteria_diag(){/,/^}/p' full-clean-reinstall.sh | grep -Fq 'sync_next_sources'
          grep -Fq 'https://github.com/Balbuto/safe-remnanode-setup' full-clean-reinstall.sh
          grep -Fq 'https://github.com/ivan-nginx/bbr3' full-clean-reinstall.sh
          grep -Fq 'sudo remnanode-next network' full-clean-reinstall.sh
          grep -Fq 'ensure_default_rkn(){' full-clean-reinstall.sh
          grep -Fq 'RKN_ASSUME_KEEP=1 "$RKN" install-safe' full-clean-reinstall.sh
          grep -Fq 'ensure_default_network(){' full-clean-reinstall.sh
          grep -Fq '"$NETWORK" ensure-default' full-clean-reinstall.sh
          ! grep -Fq 'Открыть RKN SAFE menu сейчас?' full-clean-reinstall.sh

          n=next-installer/network-tuning-manager.sh
          test "$(git rev-parse HEAD:$n)" = "8616189227534a4c651000d233162b1603a50d7b"
          test "$(git rev-parse dd7474f8f72b7d4b56221e89bb969ac75b2dff00:$n)" = "8616189227534a4c651000d233162b1603a50d7b"
          grep -Fq 'sudo remnanode-next bbr-tune' "$n"
          grep -Fq 'sudo remnanode-next bbr3' "$n"
          grep -Fq 'BBR3 — КАСТОМНОЕ ЯДРО, НУЖЕН REBOOT' "$n"
          grep -Fq 'BBR TUNE — DEFAULT, SAFE/HIGHLOAD, БЕЗ ЗАМЕНЫ ЯДРА' "$n"
          grep -Fq 'ensure_default_tune(){' "$n"
          grep -Fq 'bbr_available(){' "$n"
          grep -Fq 'rm -f "$SYSCTL_BBR3"' "$n"
          grep -Fq 'rm -f "$SYSCTL_TUNE"' "$n"

      - name: NEXT launcher pin chain
        shell: bash
        run: |
          set -Eeuo pipefail

          grep -Fq 'TASK_NAME="REMNA NODE NEXT"' full-clean-reinstall.sh
          grep -Fq 'SOURCE_REF="721269e2c48e31b7cac86e04bc14c46b33e31e72"' full-clean-reinstall.sh
          grep -Fq 'SOURCE_BLOB_SHA="51a91d5745d0bea9b03eefeeaac52677fcf56b60"' full-clean-reinstall.sh
          grep -Fq 'HYSTERIA_OVERLAY_REF="6f02c87c10d1d47fb4abcb234755823d1a1067bf"' full-clean-reinstall.sh
          grep -Fq 'HYSTERIA_OVERLAY_BLOB_SHA="62ff1364c26d88f357968422d5591b3d2b8d9e78"' full-clean-reinstall.sh
          grep -Fq 'V2_CLEANUP_REF="551a80ca1802d3087c53edf12652f104cd1c721d"' full-clean-reinstall.sh
          grep -Fq 'V2_CLEANUP_BLOB_SHA="755e94a26fa7cc835e65ce415c9d87f07a7fa86e"' full-clean-reinstall.sh
          grep -Fq 'REMNANODE NEXT — MAIN' full-clean-reinstall.sh
          grep -Fq 'Транспорт / профили (XHTTP / RAW / Hysteria2 / combined)' full-clean-reinstall.sh
          grep -Fq 'SAFE scanner guard' full-clean-reinstall.sh
          ! grep -Fq 'patch_hysteria_compat(){' full-clean-reinstall.sh
          ! grep -Fq 'install-caddy-node-reality-stream.sh' full-clean-reinstall.sh

          source_ref="$(sed -n 's/^SOURCE_REF="\([^"]*\)"/\1/p' full-clean-reinstall.sh)"
          overlay_ref="$(sed -n 's/^HYSTERIA_OVERLAY_REF="\([^"]*\)"/\1/p' full-clean-reinstall.sh)"
          v2_ref="$(sed -n 's/^V2_CLEANUP_REF="\([^"]*\)"/\1/p' full-clean-reinstall.sh)"
          tester_ref="$(sed -n 's/^TESTER_REF="\([^"]*\)"/\1/p' full-clean-reinstall.sh)"
          test "$(git rev-parse "$source_ref:vendor/remna-next-source.tar.gz")" = "51a91d5745d0bea9b03eefeeaac52677fcf56b60"
          test "$(git rev-parse "$overlay_ref:next-installer/remnawave-transport-manager.sh")" = "62ff1364c26d88f357968422d5591b3d2b8d9e78"
          test "$(git rev-parse "$v2_ref:next-installer/existing-node-v2-cleanup.sh")" = "755e94a26fa7cc835e65ce415c9d87f07a7fa86e"
          test "$(git rev-parse "$tester_ref:next-installer/server-multitest.sh")" = "2cc4cba0df9176fa169b4d4caec7f2511fdc4559"

          for launcher in install.sh clean-install.sh; do
            ref="$(sed -n 's/^PINNED_REF="\([^"]*\)"/\1/p' "$launcher")"
            expected="$(sed -n 's/^EXPECTED_BLOB_SHA="\([^"]*\)"/\1/p' "$launcher")"
            test "$(git rev-parse "$ref:full-clean-reinstall.sh")" = "$expected"
            ! grep -Fq 'install-caddy-node-reality-stream.sh' "$launcher"
          done

      - name: README architecture guard
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'Главный installer этого репозитория — **REMNANODE NEXT**' README.md
          grep -Fq 'XHTTP + Hysteria2' README.md
          grep -Fq 'SAFE scanner guard' README.md
          grep -Fq 'settings.clients: []' README.md
          grep -Fq 'Final Mask: ПУСТО / DEFAULT' README.md
          grep -Fq 'sniffing.routeOnly: true' README.md
          grep -Fq 'rejectUnknownSni: true' README.md
          grep -Fq 'sudo remnanode-next hysteria-diag' README.md
          grep -Fq 'Vless Route ID: ПУСТО / DEFAULT' README.md
          grep -Fq 'cli --dump-config-raw' README.md
          grep -Fq 'семантически сравнивает активный runtime' README.md
          grep -Fq 'Они **не являются main installer**' README.md
          grep -Fq 'Installer их из bundle **не устанавливает**' README.md
          grep -Fq 'NEXT V2 migration' README.md
          grep -Fq 'существующая/legacy нода' README.md
          grep -Fq '/root/remna-node-v2-backups/' README.md
          grep -Fq 'ставится автоматически по умолчанию' README.md
          grep -Fq 'BBR3 не ставится автоматически' README.md
          grep -Fq 'Дополнительное подтверждение `MIGRATE` не требуется' README.md
          grep -Fq 'vnext should have one and only one member' README.md
          grep -Fq 'Mapper: пусто' README.md
          grep -Fq 'ровно один' README.md
          grep -Fq 'ТОЛЬКО HOST HYSTERIA2' README.md
          grep -Fq 'sudo remnanode-next host-hysteria2' README.md
          grep -Fq 'HOST HYSTERIA2' README.md
          grep -Fq '### Мульти-тесты сервера' README.md
          grep -Fq 'Balbuto/safe-remnanode-setup' README.md
          grep -Fq 'sudo remnanode-next multitest all' README.md
          grep -Fq 'Network Bench — HTTPS 100MB' README.md
          grep -Fq 'Geo/Media Unlock — RegionRestrictionCheck' README.md
          grep -Fq 'Geekbench 4' README.md
          grep -Fq 'PASS/FAIL/SKIP' README.md
          grep -Fq 'NextTrace Route/MTR' README.md
          grep -Fq 'NextTrace Path MTU' README.md
          grep -Fq 'NextTrace Globalping' README.md
          grep -Fq 'ничего дополнительно нажимать не нужно' README.md
          grep -Fq 'aa75440fcdee46c16d941f48f9dabee1eb4c35bea6b739b0960fcf8307088c29' README.md

      - name: Legacy safety guard
        shell: bash
