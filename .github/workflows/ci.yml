        shell: bash
        run: |
          set -Eeuo pipefail

          grep -Fq 'TASK_NAME="REMNA NODE NEXT"' full-clean-reinstall.sh
          grep -Fq 'SOURCE_REF="721269e2c48e31b7cac86e04bc14c46b33e31e72"' full-clean-reinstall.sh
