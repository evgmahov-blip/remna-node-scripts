name: Apply manager dependency pins

on:
  push:
    branches: [supply-chain-v2.1]
    paths:
      - tools/apply_manager_pin.py
      - .github/workflows/apply-manager-pin.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: supply-chain-v2.1
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/apply_manager_pin.py
      - name: Syntax check
        run: |
          bash -n install-caddy-node-reality-stream.sh
          bash -n install-caddy-node-reality-stream-core.sh
          bash -n protection-manager.sh
          bash -n telemt-manager.sh
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -S error install-caddy-node-reality-stream.sh install-caddy-node-reality-stream-core.sh protection-manager.sh telemt-manager.sh
      - name: Supply-chain guard
        run: |
          set -e
          ! grep -R -nE 'remnawave/node:latest|https://get\.docker\.com|telemt/telemt/main/install\.sh|amirotin/telemt_panel/main/install\.sh' -- *.sh
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add install-caddy-node-reality-stream.sh
          git commit -m 'fix: pin internal helpers and make diagnose fully read-only'
          git push origin HEAD:supply-chain-v2.1
